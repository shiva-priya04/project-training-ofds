<main class="page checkout-page">
	<header class="topbar">
		<nav class="navbar navbar-expand-lg container nav" aria-label="Primary">
			<div class="container-fluid">
				<a class="navbar-brand brand" routerLink="/">
					<span class="brand-mark">🦀</span>
					<span>Krusty Krab</span>
				</a>
				<a class="back-link" routerLink="/cart">
					<span>&larr;</span>
					<span>Back to cart</span>
				</a>
			</div>
		</nav>
	</header>

	<section class="container bill-wrap">
		<div class="bill">
			<div class="bill__header">
				<h1>Checkout</h1>
				<p>Krusty Krab Food Delivery</p>
			</div>

			<form class="checkout-form" (ngSubmit)="placeOrder()">
				<h3 class="section-title">Delivery Address</h3>

				<div class="form-group">
					<label for="name">Name</label>
					<input class="form-control" type="text" id="name" name="name" [(ngModel)]="name" placeholder="Your full name" required>
				</div>

				<div class="form-group">
					<label for="address">Address</label>
					<textarea class="form-control" id="address" name="address" [(ngModel)]="address" placeholder="House no, street, area, city" rows="3" required></textarea>
				</div>

				<div class="form-group">
					<label for="phoneNumber">Phone Number</label>
					<input class="form-control" type="tel" id="phoneNumber" name="phoneNumber" [(ngModel)]="phoneNumber" placeholder="10-digit mobile number" required>
				</div>

				<h3 class="section-title">Payment Method</h3>

				<div class="form-group">
					<label for="paymentMethod">Choose payment method</label>
					<select class="form-control" id="paymentMethod" name="paymentMethod" [(ngModel)]="paymentMethod">
						<option value="cod">Cash on Delivery</option>
						<option value="upi">UPI</option>
						<option value="card">Card</option>
					</select>
				</div>

				@if (paymentMethod === 'upi') {
					<div class="form-group">
						<label for="upiId">UPI ID</label>
						<input class="form-control" type="text" id="upiId" name="upiId" [(ngModel)]="upiId" placeholder="yourname@upi" required>
					</div>
				}

				@if (paymentMethod === 'card') {
					<div class="form-group">
						<label for="cardNumber">Card Number</label>
						<input class="form-control" type="text" id="cardNumber" name="cardNumber" [(ngModel)]="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
					</div>

					<div class="form-row">
						<div class="form-group">
							<label for="cardExpiry">Expiry (MM/YY)</label>
							<input class="form-control" type="text" id="cardExpiry" name="cardExpiry" [(ngModel)]="cardExpiry" placeholder="MM/YY" maxlength="5" required>
						</div>

						<div class="form-group">
							<label for="cardCvv">CVV</label>
							<input class="form-control" type="password" id="cardCvv" name="cardCvv" [(ngModel)]="cardCvv" placeholder="123" maxlength="3" required>
						</div>
					</div>
				}

				<div class="bill__divider"></div>

				<div class="bill__totals">
					<div class="bill__row">
						<span>Subtotal</span>
						<span>₹{{ cart.total }}</span>
					</div>
					<div class="bill__row">
						<span>Delivery fee</span>
						<span>₹{{ deliveryFee }}</span>
					</div>
					<div class="bill__row bill__row--total">
						<span>Total</span>
						<span>₹{{ total }}</span>
					</div>
				</div>

				<div class="bill__actions">
					<button class="btn view-btn" type="submit">Place Order</button>
				</div>
			</form>
		</div>
	</section>
</main>
